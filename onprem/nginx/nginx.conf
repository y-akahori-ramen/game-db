worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Trust X-Forwarded-For from DMZ reverse proxies / local networks
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    upstream oauth2_proxy {
        server oauth2-proxy:4180;
    }

    upstream qa_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # 30GB+ large file configuration
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # ----------------------------------------------------------------------
        # OAuth2-Proxy endpoints
        # ----------------------------------------------------------------------
        location /oauth2/ {
            proxy_pass       http://oauth2_proxy;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host        $http_x_forwarded_host;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass       http://oauth2_proxy;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $http_x_forwarded_proto;
            proxy_set_header Content-Length          "";
            proxy_pass_request_body                  off;
        }

        # ----------------------------------------------------------------------
        # CLI Upload API: Authenticated via API Key (Bearer token), bypasses OAuth2-Proxy
        # ----------------------------------------------------------------------
        location /api/upload/ {
            proxy_pass http://qa_backend;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-API-Key         $http_x_api_key;
        }

        # ----------------------------------------------------------------------
        # General API endpoints (Search, Keys) protected by Google OAuth2
        # ----------------------------------------------------------------------
        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start?rd=$request_uri;

            auth_request_set $user_email $upstream_http_x_auth_request_email;
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;

            proxy_pass http://qa_backend;
            proxy_http_version 1.1;

            proxy_set_header Host                 $host;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $http_x_forwarded_proto;
            proxy_set_header X-Auth-Request-Email $user_email;
        }

        # ----------------------------------------------------------------------
        # Static Data storage (/data/runs/...) protected by Google OAuth2
        # High performance zero-copy direct streaming (sendfile, Range support)
        # ----------------------------------------------------------------------
        location /data/runs/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start?rd=$request_uri;

            alias /data/runs/;
            autoindex off;

            # Range request and streaming performance
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            aio threads;

            # Add CORS headers for DuckDB-WASM and video player
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
        }

        # ----------------------------------------------------------------------
        # Frontend SPA protected by Google OAuth2
        # ----------------------------------------------------------------------
        location / {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/start?rd=$request_uri;

            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
