services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game-qa-backend
    restart: unless-stopped
    environment:
      - STORAGE_PATH=/data
      - DB_PATH=/data/db/qa.db
      - ALLOW_ANONYMOUS_UPLOAD=${ALLOW_ANONYMOUS_UPLOAD:-false}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      - ${HOST_STORAGE_DB_PATH:-qa_db}:/data/db
      - ${HOST_STORAGE_DATA_PATH:-qa_data}:/data/runs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - game_qa_net

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: game-qa-oauth2-proxy
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=${GOOGLE_ALLOWED_DOMAINS:-*}
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=${OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE:-}
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=false
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_UPSTREAMS=http://backend:8000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=${APP_URL:-https://qa-dashboard.internal.example.com}/oauth2/callback
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - game_qa_net

  nginx:
    image: nginx:alpine
    container_name: game-qa-nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../my-qa-dashboard/dist:/usr/share/nginx/html:ro
      - ${HOST_STORAGE_DATA_PATH:-qa_data}:/data/runs:ro
    depends_on:
      backend:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - game_qa_net

volumes:
  # SQLite DB volume (Local fast SSD fallback when HOST_STORAGE_DB_PATH is unset)
  qa_db:
    driver: local
  # Large artifact storage (Host disk / NAS fallback when HOST_STORAGE_DATA_PATH is unset)
  qa_data:
    driver: local


networks:
  game_qa_net:
    driver: bridge
